<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NylasDev profile banner</title>
  <desc id="desc">An engraved parchment banner for Sergiu Vataman, NylasDev, blending AI agents, mythic interfaces, sailing, and space exploration.</desc>
  <defs>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M 0 5 H 10" stroke="#8a8576" stroke-width="0.7" opacity="0.36"/>
    </pattern>
    <linearGradient id="fadeRight" x1="650" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2efe6" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#f2efe6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2efe6"/>
    </linearGradient>
    <style>
      .paper { fill: #f2efe6; }
      .paper-warm { fill: #ece7d9; }
      .ink { fill: #16140f; }
      .soft { fill: #4d493f; }
      .faint { fill: #8a8576; }
      .accent { fill: #b0501f; }
      .rule { stroke: #d8d2c2; }
      .rule-strong { stroke: #b8b19d; }
      .ink-stroke { stroke: #16140f; }
      .soft-stroke { stroke: #4d493f; }
      .accent-stroke { stroke: #b0501f; }
      .display { font-family: Georgia, 'Times New Roman', serif; }
      .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', Consolas, monospace; letter-spacing: 0.14em; }
    </style>
  </defs>

  <rect class="paper" width="1200" height="420"/>
  <rect width="1200" height="420" filter="url(#paperGrain)" opacity="1"/>
  <rect x="24" y="24" width="1152" height="372" stroke="#d8d2c2" stroke-width="1"/>
  <rect x="36" y="36" width="1128" height="348" stroke="#b8b19d" stroke-width="1" opacity="0.55"/>

  <!-- star map / orbit plate -->
  <g opacity="0.64">
    <path d="M714 98C820 29 1009 35 1087 120C1162 202 1093 320 957 348C808 379 667 309 648 211C638 159 669 126 714 98Z" stroke="#d8d2c2" stroke-width="1.2"/>
    <path d="M740 120C833 69 988 75 1052 142C1116 210 1058 303 948 325C827 349 713 292 697 213C689 171 708 140 740 120Z" stroke="#d8d2c2" stroke-width="1" stroke-dasharray="5 9"/>
    <circle cx="1026" cy="92" r="3" fill="#b0501f" opacity="0.8"/>
    <circle cx="1091" cy="150" r="2.3" fill="#4d493f"/>
    <circle cx="1001" cy="336" r="2.4" fill="#4d493f"/>
    <circle cx="798" cy="83" r="2" fill="#8a8576"/>
    <circle cx="706" cy="277" r="2" fill="#8a8576"/>
    <path d="M786 83L851 128L931 108L1001 336L1091 150" stroke="#d8d2c2" stroke-width="1"/>
  </g>

  <!-- engraved longship, rocket, and bifrost linework -->
  <g transform="translate(665 104)" opacity="0.82">
    <path d="M58 189C120 217 303 219 393 180C338 242 152 252 58 189Z" fill="url(#hatch)" stroke="#4d493f" stroke-width="2"/>
    <path d="M104 183C130 142 180 113 248 108C318 103 367 126 407 164" stroke="#4d493f" stroke-width="1.4" opacity="0.68"/>
    <path d="M244 109V36" stroke="#16140f" stroke-width="2"/>
    <path d="M252 42C286 51 322 80 339 122C302 108 276 83 252 42Z" fill="url(#hatch)" stroke="#4d493f" stroke-width="1.7"/>
    <path d="M236 48C203 58 174 85 157 121C190 111 216 84 236 48Z" fill="url(#hatch)" stroke="#4d493f" stroke-width="1.7"/>
    <path d="M83 179C78 148 96 123 127 114" stroke="#4d493f" stroke-width="1.3"/>
    <path d="M402 160C437 142 448 108 430 85" stroke="#4d493f" stroke-width="1.3"/>
    <g stroke="#4d493f" stroke-width="1.1" opacity="0.78">
      <path d="M126 190V150"/><path d="M160 198V139"/><path d="M194 202V126"/><path d="M228 204V112"/><path d="M262 203V116"/><path d="M296 199V128"/><path d="M330 190V143"/>
    </g>
    <g transform="translate(352 -6) rotate(16)">
      <path d="M39 4C58 22 62 68 51 109C37 116 22 116 8 109C-3 68 1 22 20 4C25 -1 34 -1 39 4Z" fill="#f2efe6" stroke="#16140f" stroke-width="1.8"/>
      <path d="M17 111L9 139L29 126L49 139L41 111" stroke="#b0501f" stroke-width="1.5" fill="none"/>
      <circle cx="29.5" cy="48" r="10" stroke="#4d493f" stroke-width="1.4"/>
      <path d="M18 78H41" stroke="#4d493f" stroke-width="1.2"/>
    </g>
    <path d="M4 217C102 262 328 264 470 205" stroke="#8a8576" stroke-width="1" stroke-dasharray="4 8" opacity="0.55"/>
  </g>
  <rect x="600" y="42" width="570" height="336" fill="url(#fadeRight)" opacity="0.42"/>

  <!-- text plate -->
  <g transform="translate(74 78)">
    <text class="mono faint" x="0" y="0" font-size="14">AI AGENTS • MYTHIC INTERFACES • SEA &amp; STARS</text>
    <text class="display ink" x="0" y="88" font-size="82" font-weight="600" letter-spacing="-1.5">NylasDev</text>
    <path d="M0 112H466" class="rule-strong" stroke-width="1"/>
    <text class="display soft" x="0" y="158" font-size="28">Sergiu Vataman</text>
    <text class="display soft" x="0" y="196" font-size="28">forging practical software with a mythic edge.</text>
    <g transform="translate(0 236)">
      <rect x="0" y="0" width="520" height="52" fill="#f7f5ee" stroke="#d8d2c2"/>
      <text class="mono soft" x="22" y="32" font-size="14">&gt; build agents, tools, worlds, and vessels</text>
      <rect x="492" y="16" width="12" height="20" fill="#b0501f" opacity="0.9"/>
    </g>
  </g>

  <!-- registration marks -->
  <g stroke="#b8b19d" stroke-width="1" opacity="0.7">
    <path d="M52 52H74M63 41V63"/>
    <path d="M1126 52H1148M1137 41V63"/>
    <path d="M52 356H74M63 345V367"/>
    <path d="M1126 356H1148M1137 345V367"/>
  </g>
</svg>
